services:
  api:
    build:
      context: .
      target: api
    environment:
      DATABASE_URL: postgres://quenda:quenda_local@db:5432/quenda
      DEMO_MODE: "true"
      # The loopback demo is served over plain HTTP; never disable this behind TLS.
      COOKIE_SECURE: "false"
      HOST: 0.0.0.0
      APP_BASE_URL: http://127.0.0.1:8080
      # Identidad (perfil `identity`): Keycloak de referencia + Cl@ve SIMULADO.
      # Secreto de cliente solo para desarrollo local (ver deploy/keycloak/quenda-realm.json).
      PUBLIC_URL: http://127.0.0.1:8080
      OIDC_ISSUER: http://127.0.0.1:8081/realms/quenda
      # Dentro de la red de compose 127.0.0.1:8081 no es Keycloak: el descubrimiento (y con él
      # token y JWKS) va por el nombre del servicio; el `issuer` devuelto sigue siendo 127.0.0.1:8081.
      OIDC_DISCOVERY_URL: http://keycloak:8080/realms/quenda
      OIDC_CLIENT_ID: quenda
      OIDC_CLIENT_SECRET: quenda-local-dev-secret-NO-PRODUCCION
      OIDC_LABEL: Cl@ve
      OIDC_IDP_HINT: clave
      # Map tiles (#26): OpenStreetMap for the demo; a deployment may point to its own server.
      MAP_TILE_URL: https://tile.openstreetmap.org/{z}/{x}/{y}.png
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
        required: false
    command:
      [
        "sh",
        "-c",
        "node backend/dist/database/migrate.js && node backend/dist/database/seed.js && node backend/dist/main.js",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/v2/public/municipalities').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
  worker:
    build:
      context: .
      target: api
    environment:
      DATABASE_URL: postgres://quenda:quenda_local@db:5432/quenda
      DEMO_MODE: "true"
      SMTP_URL: smtp://mailpit:1025
      MAIL_FROM: quenda@demo.example
      APP_BASE_URL: http://127.0.0.1:8080
    depends_on:
      api:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    command: ["node", "backend/dist/worker.js"]
  web:
    build:
      context: .
      target: web
    ports: ["127.0.0.1:8080:80"]
    environment:
      MAP_TILE_ORIGIN: https://tile.openstreetmap.org
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 10
