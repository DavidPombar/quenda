services:
  api:
    build:
      context: .
      target: api
    environment:
      DATABASE_URL: postgres://quenda:quenda_local@db:5432/quenda
      DEMO_MODE: "true"
      HOST: 0.0.0.0
      APP_BASE_URL: http://127.0.0.1:8080
    depends_on:
      db:
        condition: service_healthy
    command:
      [
        "sh",
        "-c",
        "node backend/dist/database/migrate.js && node backend/dist/database/seed.js && node backend/dist/main.js",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/v2/public/municipalities').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
  worker:
    build:
      context: .
      target: api
    environment:
      DATABASE_URL: postgres://quenda:quenda_local@db:5432/quenda
      DEMO_MODE: "true"
      SMTP_URL: smtp://mailpit:1025
      MAIL_FROM: quenda@demo.example
      APP_BASE_URL: http://127.0.0.1:8080
    depends_on:
      api:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    command: ["node", "backend/dist/worker.js"]
  web:
    build:
      context: .
      target: web
    ports: ["127.0.0.1:8080:80"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 10
