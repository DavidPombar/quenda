name: quenda
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: quenda
      POSTGRES_PASSWORD: quenda_local
      POSTGRES_DB: quenda
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["quenda-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quenda -d quenda"]
      interval: 2s
      timeout: 5s
      retries: 20
  # Catches development email; open http://127.0.0.1:8025 to read it.
  mailpit:
    image: axllent/mailpit:v1.31.4
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
  # Keycloak de referencia (OIDC) con un realm «clave-sim» que SIMULA Cl@ve por SAML.
  # Opcional: solo arranca con `npm run identity:up` (perfil `identity`), nunca con `db:up`/`setup`.
  # Memoria: reserva ~1 GB de RAM para este contenedor (JVM). Usuario/contraseña de admin
  # por defecto solo para uso local en 127.0.0.1; sobrescríbelos con KEYCLOAK_ADMIN_USER/PASSWORD.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    profiles: ["identity"]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_local}
      # El navegador y el `issuer` usan siempre 127.0.0.1:8081; las llamadas de servidor
      # (token, JWKS) pueden entrar por http://keycloak:8080 dentro de la red de compose.
      KC_HOSTNAME: http://127.0.0.1:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports: ["127.0.0.1:8081:8080"]
    volumes: ["./deploy/keycloak:/opt/keycloak/data/import:ro"]
    healthcheck:
      # La imagen no trae curl: petición HTTP a mano al puerto de gestión (9000).
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3",
        ]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 30
  # Umami (MIT) de referencia para a analítica web opcional (#25). Só arranca con
  # `npm run analytics:up` (perfil `analytics`). Panel en http://127.0.0.1:8095 (admin / umami);
  # crea alí un sitio e pon o seu identificador e http://127.0.0.1:8095 en Axustes → Analítica web.
  umami:
    image: ghcr.io/umami-software/umami:postgresql-v2.20.2
    profiles: ["analytics"]
    environment:
      DATABASE_URL: postgresql://umami:umami_local@umami-db:5432/umami
      APP_SECRET: umami-local-secret-NO-PRODUCCION
    ports: ["127.0.0.1:8095:3000"]
    depends_on:
      umami-db:
        condition: service_healthy
  umami-db:
    image: postgres:17-alpine
    profiles: ["analytics"]
    environment:
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: umami_local
      POSTGRES_DB: umami
    volumes: ["umami-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 2s
      timeout: 5s
      retries: 20
volumes:
  quenda-data:
  umami-data:
