# One-server deployment: PostgreSQL, the API, the delivery worker, the web container and Caddy
# with automatic HTTPS. Values come from `.env` next to this file (see deploy/server/env.example);
# `deploy/server/install.sh` creates it with fresh secrets. Guide: docs/architecture/deployment.md.
name: quenda
x-api-env: &api-env
  DATABASE_URL: postgres://quenda:${POSTGRES_PASSWORD:?}@db:5432/quenda
  DEMO_MODE: ${DEMO_MODE:-false}
  APP_BASE_URL: https://${QUENDA_DOMAIN:?}
  PUBLIC_URL: https://${QUENDA_DOMAIN:?}
  QUENDA_DATA_KEY: ${QUENDA_DATA_KEY:?}
  ACCESS_KEY_SECRET: ${ACCESS_KEY_SECRET:?}
  UNSUBSCRIBE_SECRET: ${UNSUBSCRIBE_SECRET:?}
  SMTP_URL: ${SMTP_URL:-}
  MAIL_FROM: ${MAIL_FROM:-}
  EMAIL_LOGIN: ${EMAIL_LOGIN:-}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-}
  MAP_TILE_URL: ${MAP_TILE_URL:-https://tile.openstreetmap.org/{z}/{x}/{y}.png}
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: quenda
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: quenda
    volumes: [db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "quenda"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: { context: ../.., target: api }
    image: quenda-api
    restart: unless-stopped
    environment: *api-env
    depends_on:
      db: { condition: service_healthy }
    # Migrations run on every start; the demo also (re)loads its synthetic municipalities.
    command:
      [
        "sh",
        "-c",
        'node backend/dist/database/migrate.js && if [ "$$DEMO_MODE" = true ]; then node backend/dist/database/seed.js; fi && node backend/dist/main.js',
      ]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/v2/public/municipalities').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
  worker:
    image: quenda-api
    restart: unless-stopped
    environment: *api-env
    depends_on:
      api: { condition: service_healthy }
    command: ["node", "backend/dist/worker.js"]
  web:
    build: { context: ../.., target: web }
    restart: unless-stopped
    environment:
      MAP_TILE_ORIGIN: ${MAP_TILE_ORIGIN:-https://tile.openstreetmap.org}
    depends_on:
      api: { condition: service_healthy }
  # Only Caddy is published. It replaces any client X-Forwarded-For, which the API trusts from
  # private networks (TRUST_PROXY) for per-client rate limits.
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      QUENDA_DOMAIN: ${QUENDA_DOMAIN:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [web]
volumes:
  db:
  caddy-data:
  caddy-config:
