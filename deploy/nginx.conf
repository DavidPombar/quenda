# Serves the three SPAs and proxies the API. TLS terminates in a proxy in front
# (see deploy/Caddyfile), which also sends HSTS.
map $http_x_forwarded_proto $quenda_forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}
map $uri $quenda_camera_policy {
  default "()";
  ~^/admin/ "(self)";
}
# Origin of the map tile server (MAP_TILE_ORIGIN), allowed as an image source for the facility
# map; it must match the API's MAP_TILE_URL. Rendered by the nginx image's envsubst templates.
map $uri $quenda_map_tiles {
  default "${MAP_TILE_ORIGIN}";
}
map $uri $quenda_worker_policy {
  default "'self'";
  ~^/admin/ "'self' blob:";
}
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  client_max_body_size 128k;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $quenda_forwarded_proto;
  location /v2/ { proxy_pass http://api:3001; }
  location /api/ { proxy_pass http://api:3001; }
  # Municipal logo and facility photo uploads retain their dedicated size limits.
  location = /v2/manager/municipality/logo { client_max_body_size 3m; proxy_pass http://api:3001; }
  location ~ ^/v2/manager/facilities/[^/]+/photos$ { client_max_body_size 5m; proxy_pass http://api:3001; }
  location = /app { return 308 /app/; }
  location /app/assets/ { include /etc/nginx/snippets/security-headers.conf; try_files $uri =404; }
  location /app/ { include /etc/nginx/snippets/security-headers.conf; try_files $uri $uri/ /app/index.html; }
  location = /admin { return 308 /admin/; }
  location /admin/assets/ { include /etc/nginx/snippets/security-headers.conf; try_files $uri =404; }
  location /admin/ { include /etc/nginx/snippets/security-headers.conf; try_files $uri $uri/ /admin/index.html; }
  location / { include /etc/nginx/snippets/security-headers.conf; try_files $uri $uri/ /index.html; }
}
