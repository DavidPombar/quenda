server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 128k;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  location /v2/ { proxy_pass http://api:3001; proxy_set_header Host $host; }
  location /api/ { proxy_pass http://api:3001; proxy_set_header Host $host; }
  location = /app { return 308 /app/; }
  location /app/assets/ { try_files $uri =404; }
  location /app/ { try_files $uri $uri/ /app/index.html; }
  location = /admin { return 308 /admin/; }
  location /admin/assets/ { try_files $uri =404; }
  location /admin/ { try_files $uri $uri/ /admin/index.html; }
  location / { try_files $uri $uri/ /index.html; }
}
