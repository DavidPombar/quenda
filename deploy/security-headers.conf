# Security headers for the static SPAs. API responses keep the API's own
# headers (helmet), so this file is included only in the SPA locations.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy same-origin always;
add_header X-Frame-Options DENY always;
add_header Permissions-Policy "camera=$quenda_camera_policy, microphone=(), geolocation=(), payment=(), usb=()" always;
# Chakra UI (Emotion) injects <style> elements at runtime, hence 'unsafe-inline'
# for styles only. Scripts, fonts and data are served from this origin.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src $quenda_worker_policy; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
